<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:5120px;height:2880px;overflow:hidden}svg{display:block}</style></head><body>
<svg id="s" width="5120" height="2880" viewBox="0 0 5120 2880"><rect width="5120" height="2880" fill="#4fc6e9"/><rect x="2300" y="0" width="560" height="78" rx="39" fill="#000"/>
<script>const s=document.getElementById('s'),ns='http://www.w3.org/2000/svg';
function riss(cx,cy,n,len){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,x=cx,y=cy,d='M'+x+','+y,l=len*(0.5+Math.random());for(let k=0;k<6;k++){a+=(Math.random()-0.5)*0.9;const st=l/6;x+=Math.cos(a)*st;y+=Math.sin(a)*st;d+=' L'+x+','+y;}const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('stroke','#111');p.setAttribute('stroke-width',6+Math.random()*10);p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');s.appendChild(p);}
for(let i=0;i<n*2;i++){const r=Math.random()*len*0.5,a=Math.random()*Math.PI*2;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;let b=a+Math.PI/2+(Math.random()-0.5);const p=document.createElementNS(ns,'path');p.setAttribute('d','M'+x+','+y+' l'+Math.cos(b)*120+','+Math.sin(b)*120);p.setAttribute('stroke','#111');p.setAttribute('stroke-width',5);s.appendChild(p);}}
riss(2800,60,18,700);riss(4900,1900,14,500);riss(300,2650,14,450);</script>
</svg></body></html>
